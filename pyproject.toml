[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[project]
name = "corpmind"
version = "0.1.0"
description = "corpMind M1-001 离线只读工具学习骨架"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.uv]
required-version = "==0.13.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers -m 'not exercise'"
markers = ["exercise: 开发者动手练习，查询函数未实现前预期失败；显式 -m exercise 启用"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
